<h1>設定：音</h1>
<figure class="shot side-r"><img src="../img/manual/set_sound.jpg" alt="設定の「音」タブ" loading="lazy"><figcaption>設定の「音」タブ</figcaption></figure>
    <dl class="set">
      <dt>シャッター音量<span class="init">初期値 10</span></dt>
      <dd>このアプリの中だけの音量で、端末の音量とは別です。</dd>
      <dt>シャッター音の種類<span class="init">初期値 ミラーレス</span></dt>
      <dd><span class="opt">ミラーレス（乾いた2打） / コンパクト（軽い） / 高速連写機（鋭い2打） / 無音</span>
        ▶ で試聴できます。「無音」にするとアプリからは鳴りません。ただ、法令で撮影音が決められている端末では、端末側の音が別に鳴ることがあります。</dd>
    </dl>
