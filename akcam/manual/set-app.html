<h1>設定：アプリ</h1>
<figure class="shot side-r"><img src="../img/manual/set_app.jpg" alt="設定の「アプリ」タブ" loading="lazy"><figcaption>設定の「アプリ」タブ</figcaption></figure>
    <dl class="set">
      <dt>バージョン</dt>
      <dd>アプリのバージョンと端末の情報。不具合を知らせるときに添えてください。</dd>
      <dt>使い方とサイト</dt>
      <dd>このページとプライバシーポリシーをブラウザで開きます。アプリ自体は通信しません。</dd>
      <dt>連絡先</dt>
      <dd>「メールで連絡する」を押すと、書く欄だけ空いたメールの下書きが開きます。バージョンと端末名は自動で入ります。X（旧Twitter）も開けます。</dd>
      <dt>開発を支援する</dt>
      <dd>Ko-fi のページを開きます。支援してもしなくても、使える機能は同じです。</dd>
      <dt>権利表記 / オープンソースソフトウェア</dt>
      <dd>権利表記と、使っているライブラリの一覧です。全文は <a href="../licenses.html">ライセンスと免責事項</a> にあります。</dd>
    </dl>
